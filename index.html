<style>
/* Layout: a card-table felt. Bank tray up top, one row per seat, action rail pinned to the bottom edge. Deliberately one dark look, like the Android app. */
:root {
  color-scheme: dark;
  --felt: #0c3b29;          /* table felt, bank card */
  --felt-deep: #072218;     /* bars */
  --ground: #0b1310;        /* page */
  --seat: #15201b;          /* player rows */
  --seat-line: #24332c;
  --ink: #e6ede8;
  --ink-soft: #a9b9b0;
  --ink-faint: #6f8278;
  --mint: #6fcf8a;          /* primary action, money paid */
  --brass: #f2c94c;         /* IOUs, attention */
  --claret: #e2736b;        /* conclude, errors */
  --sheet: #18241e;         /* dialogs */
  --field: #0f1814;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1040px; margin: 0 auto; padding-block: 0 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { display: flex; align-items: center; gap: 12px; padding-block: 18px 14px; }
header.top h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 7.5vw, 30px); letter-spacing: .02em; margin: 0; text-transform: uppercase; white-space: nowrap; }
header.top .ghost { white-space: nowrap; }
header.top .spacer { flex: 1; }
@media (max-width: 345px) { header.top { gap: 6px; } header.top h1 { font-size: 21px; } header.top .ghost { padding-inline: 8px; font-size: 13px; } }
.ghost { background: none; border: 1px solid var(--seat-line); border-radius: 999px; padding: 7px 14px; color: var(--ink-soft); font-size: 14px; }
.ghost:hover { border-color: var(--ink-faint); color: var(--ink); }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: #2a2410; border: 1px solid #5b4b17; color: #f5e3a6; border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; }
.banner p { margin: 0; flex: 1 1 240px; min-width: 0; }
.banner button { background: var(--brass); color: #2b2000; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 860px) { .layout { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } .bank { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); } }

/* Bank tray */
.bank { background: var(--felt); border-radius: 18px; padding: 18px; box-shadow: inset 0 0 0 1px #165a3f, inset 0 0 60px rgba(0,0,0,.35); }
.bank .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #b5d8c3; }
.bank .big { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; margin: 4px 0 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 600; font-size: clamp(16px, 5.4vw, 21px); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #b5d8c3; }
.stat.warn b { color: var(--brass); } .stat.bad b { color: var(--claret); }
.status { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.12); font-size: 13px; color: #cfe6d8; }

/* Seats */
.seats { display: grid; gap: 10px; }
.seat { background: var(--seat); border: 1px solid var(--seat-line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; }
.seat-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.seat-name { font-family: var(--f-display); font-weight: 600; font-size: 24px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.seat-name:hover { text-decoration: underline dotted var(--ink-faint); text-underline-offset: 4px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; color: #06140c; background: var(--mint); white-space: nowrap; }
.pill.out { background: #8fa39a; }
.seat .in { font-size: 16px; }
.seat .in strong { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.trail { font-size: 13px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.tag { white-space: nowrap; }
.tag i { font-style: normal; color: var(--ink-faint); }
.tag i.settled { color: var(--mint); }
.paid { font-size: 13px; color: var(--mint); }
.owes { font-weight: 600; color: var(--brass); }
.owes.collect { color: var(--mint); }
.seat-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { border-radius: 999px; padding: 8px 16px; border: 1px solid var(--seat-line); background: transparent; font-weight: 500; }
.btn:hover { border-color: var(--ink-faint); }
.btn.primary { background: var(--mint); border-color: var(--mint); color: #06140c; font-weight: 600; }
.btn.brass { color: var(--brass); border-color: #5b4b17; }
.btn.danger { background: var(--claret); border-color: var(--claret); color: #2a0806; font-weight: 600; }
.btn:disabled { opacity: .4; cursor: default; }

.empty { border: 1px dashed var(--seat-line); border-radius: var(--r); padding: 28px; color: var(--ink-soft); text-align: center; }
.empty .btn { margin-top: 12px; }

/* Action rail */
.rail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--felt-deep); border-top: 1px solid #12372a;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rail .link { background: none; border: 0; color: var(--mint); padding: 8px 6px; font-weight: 500; }
.rail .link:disabled { color: var(--ink-faint); cursor: default; }
.rail .grow { flex: 1; }

/* Dialogs */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2,8,5,.66); display: flex; align-items: flex-end; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
@media (min-width: 560px) { .scrim { align-items: center; } }
.sheet { background: var(--sheet); border: 1px solid var(--seat-line); border-radius: 18px; width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 26px; text-wrap: balance; }
.sheet .sub { margin: 0; color: var(--ink-soft); font-size: 14px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.field label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.input { display: flex; align-items: center; background: var(--field); border: 1px solid var(--seat-line); border-radius: 10px; padding: 0 12px; }
.input:focus-within { border-color: var(--mint); }
.input span { color: var(--ink-faint); }
.input input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 11px 6px; font-size: 17px; }
.err { color: var(--claret); font-size: 13px; margin: 0; }
.err:empty { display: none; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { border: 1px solid var(--seat-line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.choice[aria-pressed="true"] { background: #2c3f36; border-color: #4f6b5e; font-weight: 600; }
.quick { border: 1px solid var(--seat-line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink-soft); }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.lastp { display: flex; align-items: center; gap: 8px; color: var(--brass); font-size: 13px; }
.lastp span { flex: 1; }
.lastp button { background: none; border: 1px solid #5b4b17; color: var(--brass); border-radius: 999px; padding: 4px 12px; }

/* Chip counter */
.chips { display: grid; gap: 8px; }
.chiprow { display: grid; grid-template-columns: 40px 32px minmax(0,1fr) 32px 64px; align-items: center; gap: 6px; }
.chiprow:has(> :nth-child(3):last-child) { grid-template-columns: 40px minmax(0,1fr) 84px; }
.chip { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: repeating-conic-gradient(#f4f4f4 0 14deg, var(--c) 14deg 45deg); box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.chip::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px rgba(255,255,255,.6); }
.chip b { position: relative; font-family: var(--f-display); font-size: 13px; font-weight: 700; color: var(--t, #fff); }
.step { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #2c3f36; font-size: 18px; line-height: 1; }
.step:hover { background: #3a5247; }
.count { background: var(--field); border: 1px solid var(--seat-line); border-radius: 8px; padding: 7px 4px; text-align: center; font-size: 17px; width: 100%; min-width: 0; outline: none; }
.count:focus { border-color: var(--mint); }
.count.bad { border-color: var(--claret); }
.sub-amt { text-align: right; font-size: 13px; color: var(--ink-soft); }
.counted { display: flex; justify-content: space-between; font-weight: 600; padding-top: 4px; }

.quote { background: #101a15; border: 1px solid var(--seat-line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 3px; font-size: 14px; }
.quote .row { display: flex; justify-content: space-between; gap: 10px; }
.quote .pay { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--seat-line); margin-top: 6px; padding-top: 8px; }
.quote .pay span { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; }
.quote .pay b { font-family: var(--f-display); font-weight: 700; font-size: 38px; color: var(--mint); line-height: 1; }
.quote .pay:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.note { font-size: 13px; color: var(--brass); }
.warn { font-size: 13px; color: var(--claret); }

/* Report */
.report { display: grid; gap: 14px; }
.report-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.report-head h2 { margin: 0; font-family: var(--f-display); font-size: 30px; font-weight: 600; flex: 1; min-width: 0; }
@media (max-width: 559px) {
  /* Narrow screens: buttons share the top row, the title gets its own line below */
  .report-head h2 { flex-basis: 100%; order: 2; }
  .report-head > :last-child:not(h2) { order: 1; margin-left: auto; }
}
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.check { border-radius: 12px; padding: 10px 12px; background: #13301f; border: 1px solid #1f4a33; }
.check.no { background: #3a1716; border-color: #6b2b28; }
.check b { display: block; color: var(--mint); }
.check.no b { color: var(--claret); }
.check p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.tablebox { overflow-x: auto; border: 1px solid var(--seat-line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--seat-line); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
.standings { display: grid; gap: 10px; }
.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.hero { border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; }
.hero.win { background: var(--felt); box-shadow: inset 0 0 0 1px #1d6b4a; }
.hero.lose { background: #3a1716; box-shadow: inset 0 0 0 1px #6b2b28; }
.hero-lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.hero b { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; overflow-wrap: anywhere; }
.hero-amt { font-family: var(--f-display); font-weight: 600; font-size: 24px; }
.hero.win .hero-amt { color: var(--mint); } .hero.lose .hero-amt { color: var(--claret); }
.ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ranks li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--seat); border: 1px solid var(--seat-line); border-radius: 12px; padding: 8px 12px; }
.rk { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--ink-faint); }
.rn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv { display: grid; justify-items: end; }
.rv b { font-family: var(--f-display); font-weight: 600; font-size: 22px; }
.rv small { font-size: 12px; color: var(--ink-faint); }
.ranks li.up .rv b { color: var(--mint); } .ranks li.down .rv b { color: var(--claret); }
.rank-note { font-size: 12px; margin: 0; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
tfoot td { font-weight: 600; border-bottom: 0; }
pre.text { margin: 0; overflow-x: auto; background: #0e1612; border: 1px solid var(--seat-line); border-radius: 12px; padding: 14px; font-family: var(--f-mono); font-size: 12px; line-height: 1.55; color: #d6e2db; }
.history { display: grid; gap: 8px; }
.rail-actions { display: inline-flex; gap: 8px; margin-left: auto; }
/* Phones: Add Player + End Session centered on top, Undo / Report / Save & Exit on the row below */
@media (max-width: 640px) {
  .rail-actions { order: -1; flex-basis: 100%; justify-content: center; margin: 0 0 2px; }
  .rail .grow { display: none; }
  .rail-in { justify-content: center; }   /* Undo / Report / Save & Exit centered too */
}
.seats-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.seats-head span { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.btn.start-btn { background: var(--brass); border-color: var(--brass); color: #2b2000; font-weight: 700; }
.btn.start-btn:disabled { background: transparent; color: var(--ink-faint); border-color: var(--seat-line); }
.start-card { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--seat); border: 1px dashed #3d5a4c; border-radius: var(--r); padding: 14px; margin-bottom: 14px; }
.start-card > div { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; } .start-card strong { font-family: var(--f-display); font-weight: 600; font-size: 22px; } .start-card span { color: var(--ink-soft); font-size: 13px; }
.ptable { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16 / 12; margin: 10px auto 22px; }
.pt-felt { position: absolute; inset: 12% 10%; border-radius: 50%; background: radial-gradient(ellipse at center, #17734c 0%, #0f5a3a 60%, #0b4a2f 100%);
  box-shadow: 0 0 0 7px #6b4220, 0 0 0 9px #2b1a0c, inset 0 0 40px rgba(0,0,0,.45); }
.pt-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; text-align: center; gap: 1px; }
.pt-lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #b5d8c3; }
.pt-clock { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 8vw, 40px); line-height: 1; color: #fff; }
.pt-chips { font-size: 12px; color: #cfe6d8; }
.pt-seat { position: absolute; transform: translate(-50%, -50%); width: clamp(58px, 18%, 100px); background: #f4f1ea; color: #141414; border: 2px solid #1b1b1b; border-radius: 12px;
  padding: 4px 6px; display: grid; justify-items: center; line-height: 1.15; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
.pt-seat b { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-seat span { font-size: 11px; color: #2f6b2c; font-weight: 600; }
.pt-seat i.pt-pos { background: #2c3f36; letter-spacing: .02em; font-size: 9px; }
.pt-seat i.pt-pos.btn { background: #6b5a1c; } .pt-seat i.pt-pos.blind { background: #3d4f8f; }
.pt-open { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; border: 2px dashed rgba(230,237,232,.35); background: rgba(7,34,24,.55);
  color: var(--ink-soft); display: grid; place-items: center; padding: 0; font: inherit; line-height: 1; }
.pt-open span { font-size: 18px; margin-top: -2px; } .pt-open small { position: absolute; bottom: -14px; font-size: 9px; color: var(--ink-faint); }
.pt-open.empty { opacity: .5; }
@media (max-width: 480px) {
  .ptable { aspect-ratio: 1 / 1.08; margin-top: 4px; }
  .pt-felt { inset: 14% 16%; }
  .pt-seat { width: clamp(54px, 19vw, 76px); padding: 3px 4px; border-radius: 10px; }
  .pt-seat b { font-size: 11px; } .pt-seat span { font-size: 10px; } .pt-seat i.pt-pos { font-size: 8.5px; padding: 0 5px; }
  .pt-dealer { width: 19px; height: 19px; font-size: 11px; top: -8px; right: -8px; }
  .pt-clock { font-size: clamp(22px, 7vw, 32px); }
}
.bomb-btn, .move-btn { white-space: nowrap; }
button.pt-open:hover, button.pt-open:focus-visible { border-color: var(--brass); color: var(--brass); }
.pt-seat i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: #8fa39a; border-radius: 999px; padding: 0 6px; margin-top: 1px; }
.pt-seat.out { opacity: .6; }
button.pt-seat { cursor: pointer; font: inherit; }
button.pt-seat:hover, button.pt-seat:focus-visible { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(242,201,76,.45), 0 3px 10px rgba(0,0,0,.35); }
.pt-dealer { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; background: #f7f5ef; color: #141414; border: 2px solid #1b1b1b;
  font-style: normal; font-family: var(--f-display); font-weight: 700; font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 2px #f2c94c; }
.pt-hint { position: absolute; left: 0; right: 0; bottom: -14px; margin: 0; text-align: center; font-size: 11px; color: var(--ink-faint); }
.deal-ann { display: grid; justify-items: center; text-align: center; gap: 8px; }
.deal-chip { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: #f7f5ef; color: #141414; border: 3px solid #1b1b1b;
  box-shadow: 0 0 0 4px #f2c94c; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; }
@media (prefers-reduced-motion: no-preference) { .deal-chip { animation: deal-spin .7s ease-out; } @keyframes deal-spin { from { transform: rotate(-200deg) scale(.4); opacity: 0; } } }
.wheel-wrap { position: relative; width: min(260px, 70vw); aspect-ratio: 1; margin: 4px auto 0; }
.wheel, .wheel-svg { width: 100%; height: 100%; display: block; }
.wheel-svg { pointer-events: none; }   /* the spun wheel's corners can overlap the game name below it: taps go through */
.wheel-svg.small { width: 96px; height: 96px; margin: 0 auto; }
.wheel-txt { font-family: var(--f-display); font-weight: 700; font-size: 10px; fill: #fff; stroke: #1b1b1b; stroke-width: .6px; paint-order: stroke; }

<script>
/*CORE-START*/
// ===== Money logic: a port of the tested Kotlin core. All amounts are integer cents. =====
/** Seats at the table. */
const TABLE_SEATS = 10;
const DEALER_SEAT = TABLE_SEATS / 2;   // the seat drawn at the bottom of the table: the first dealer always starts here
/** Position names clockwise after the big blind, by how many players sit between the big blind and the button. */
const MID_POSITIONS = [[], ["UTG"], ["UTG", "CO"], ["UTG", "HJ", "CO"], ["UTG", "LJ", "HJ", "CO"], ["UTG", "UTG+1", "LJ", "HJ", "CO"],
  ["UTG", "UTG+1", "UTG+2", "LJ", "HJ", "CO"], ["UTG", "UTG+1", "UTG+2", "MP", "LJ", "HJ", "CO"]];
const CFG = { unit: 5, round: 100, maxBuy: 1000000, maxName: 30, maxInput: 100000000, maxCount: 99999 };
// "Transfer" covers Venmo, Zelle, PayPal and similar. The stored key stays VENMO so older saves still load.
/** Games the Curtis Game wheel can land on. */
const CURTIS_GAMES = ["Texas Hold'em", "Seven Card Stud", "PLO", "Follow the Queen", "Iron Cross", "Baseball", "Crazy Pineapple", "Razz", "Double Board PLO", "Chicago", "Irish"];
const METHOD = { CASH: "Cash", VENMO: "Transfer", IOU: "IOU" };
/** Cash-outs from Cash Everyone Out are paid through Settle Up (bank cash first, then straight from players who owe). */
const PAYOUT = { CASH: "Cash", VENMO: "Transfer", PLAN: "Settle Up" };
/** Chip colors to pick from. */
const CHIP_COLORS = {
  red: { name: "Red", hex: "#C62828" }, green: { name: "Green", hex: "#2E7D32" }, black: { name: "Black", hex: "#141414" },
  purple: { name: "Purple", hex: "#7B1FA2" }, yellow: { name: "Yellow", hex: "#F2B705", text: "#1b1400" }, blue: { name: "Blue", hex: "#1E5BB8" },
  orange: { name: "Orange", hex: "#E8710A", text: "#1b1400" }, pink: { name: "Pink", hex: "#D6337F" },
  gray: { name: "Gray", hex: "#6B7280" }, brown: { name: "Brown", hex: "#7A4A25" }, teal: { name: "Teal", hex: "#0F8B8D" },
};
/** Chip values to pick from, in cents. */
const CHIP_VALUES = [1, 5, 10, 25, 50, 100, 200, 500, 1000, 2000, 2500, 5000, 10000, 50000, 100000];
/** The original chip set. Chip counts saved before chip sets could be changed use these values. */
const DEFAULT_CHIPS = [{ cents: 5, color: "red", count: 0 }, { cents: 25, color: "green", count: 0 }, { cents: 100, color: "black", count: 0 },
  { cents: 500, color: "purple", count: 0 }, { cents: 1000, color: "yellow", count: 0 }];
const DEFAULT_DENOMS = DEFAULT_CHIPS.map(c => c.cents);
const chipLabel = c => c < 100 ? `${c}¢` : c >= 100000 ? `$${c / 100000}K` : `$${c / 100}`;
/** The chip set in use: five to seven slots, rebuilt by ChipSet.apply. */
const CHIPS = [];
class LedgerError extends Error {}

const Money = {
  parse(input) {
    if (input == null) return null;
    let s = String(input).trim();
    if (s.startsWith("$")) s = s.slice(1).trim();
    if (!s) return null;
    const dot = s.indexOf(".");
    const wholeRaw = dot >= 0 ? s.slice(0, dot) : s;
    const frac = dot >= 0 ? s.slice(dot + 1) : "";
    if (frac.includes(".") || frac.includes(",")) return null;
    if (wholeRaw.includes(",") && !/^\d{1,3}(,\d{3})+$/.test(wholeRaw)) return null;
    const whole = wholeRaw.replace(/,/g, "");
    if (!whole && !frac) return null;
    if (!/^[0-9]*$/.test(whole) || !/^[0-9]*$/.test(frac)) return null;
    if (frac.length > 2 || whole.length > 9) return null;
    const cents = (whole ? Number(whole) : 0) * 100 + (frac.length === 0 ? 0 : frac.length === 1 ? Number(frac) * 10 : Number(frac));
    return cents > CFG.maxInput ? null : cents;
  },
  fmt(c) {
    const neg = c < 0, a = Math.abs(c);
    const d = Math.floor(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + "$" + d + "." + String(a % 100).padStart(2, "0");
  },
  signed(c) { return c > 0 ? "+" + Money.fmt(c) : Money.fmt(c); },
  round(c, inc = CFG.round) { if (c < 0) throw new Error("negative"); return Math.floor((c + inc / 2) / inc) * inc; },
  field(c) { return c == null ? "" : Money.fmt(c).slice(1).replace(/,/g, ""); },
};

const Chips = {
  denoms() { return CHIPS.map(c => c.cents); },
  /** Value of a count per slot, with the chip values in use when it was counted (the current set if not given). */
  total(counts, denoms = Chips.denoms()) {
    if (!Chips.validDenoms(denoms) || !Array.isArray(counts) || counts.length !== denoms.length || counts.some(n => !Number.isInteger(n) || n < 0 || n > CFG.maxCount)) throw new LedgerError("Invalid chip count.");
    return counts.reduce((s, n, i) => s + n * denoms[i], 0);
  },
  validDenoms(d) { return Array.isArray(d) && d.length >= 1 && d.length <= ChipSet.MAX && d.every(c => Number.isInteger(c) && c > 0 && c <= 1000000); },
  parseCount(s) { s = String(s).trim(); if (!s) return 0; if (s.length > 5 || !/^[0-9]+$/.test(s)) return null; return Number(s); },
  describe(counts, denoms = Chips.denoms()) {
    const nameOf = c => { const k = CHIPS.find(x => x.cents === c); return k ? k.name : chipLabel(c); };
    const parts = counts.map((n, i) => [n, i]).filter(([n]) => n > 0).sort((a, b) => denoms[b[1]] - denoms[a[1]]).map(([n, i]) => `${n} ${nameOf(denoms[i])} (${Money.fmt(n * denoms[i])})`);
    return parts.length ? parts.join(", ") : "no chips";
  },
};

class Ledger {
  constructor(events = [], voided = [], clock = () => Date.now(), rng = Math.random) { this.events = events; this.voided = voided; this.clock = clock; this.rng = rng; }
  nextId() { return Math.max(0, ...this.events.map(e => e.id), ...this.voided.map(e => e.id)) + 1; }
  nextPid() { return Math.max(0, ...[...this.events, ...this.voided].filter(e => e.t === "add").map(e => e.pid)) + 1; }
  get isConcluded() { return this.events.some(e => e.t === "end"); }
  get canUndo() { return this.events.length > 0; }
  get startedAt() { return this.events[0]?.time ?? null; }
  get concludedAt() { const e = this.events.filter(e => e.t === "end").pop(); return e ? e.time : null; }
  /** Session clock: set by Start Session, stopped by End Session. */
  get timerStart() { const e = this.events.find(e => e.t === "start"); return e ? e.time : null; }
  get isStarted() { return this.timerStart != null; }
  /** Milliseconds on the session clock (still running if the session hasn't ended). */
  elapsed(now = this.clock()) { const s = this.timerStart; if (s == null) return null; return Math.max(0, (this.concludedAt ?? now) - s); }
  /** Seat order around the table: the shuffle from Start Session, plus players who joined later in their random seats. */
  /**
   * The table: TABLE_SEATS seats, each holding a player who is still in (cashed-out players leave
   * the table; buying back in takes a new seat). Returns an array of pids or null for an open seat.
   * Older saves (seats as an ordered list) are spread around the table.
   */
  table() { return this._seatReplay().seats; }
  /** Replays the night's seat changes: who sits where, and which seat has the dealer button. */
  _seatReplay() {
    const seats = new Array(TABLE_SEATS).fill(null), st = this.events.find(e => e.t === "start"); if (!st) return { seats, b: -1, st };
    const active = new Set(), free = () => seats.indexOf(null);
    const put = (pid, k) => { if (seats.includes(pid)) return; if (!(Number.isInteger(k) && k >= 0 && k < TABLE_SEATS && seats[k] == null)) k = free(); if (k >= 0) seats[k] = pid; };
    const nextTaken = b => { for (let i = 0; i < TABLE_SEATS; i++) { const k = ((b < 0 ? 0 : b) + i) % TABLE_SEATS; if (seats[k] != null) return k; } return -1; };
    let b = null, after = false;   // b: the button's seat (null until known for older saves that only recorded the dealer)
    for (const e of this.events) {
      if (e.t === "buy") active.add(e.pid);
      else if (e.t === "out") { active.delete(e.pid); const k = seats.indexOf(e.pid); if (k >= 0) seats[k] = null; }
      else if (e.t === "start") {
        if (Array.isArray(e.seats)) e.seats.forEach((pid, k) => { if (pid != null && active.has(pid)) seats[k] = pid; });
        else { const order = (e.order || []).filter(pid => active.has(pid)); order.forEach((pid, i) => put(pid, Math.floor((i * TABLE_SEATS) / Math.max(order.length, 1)))); }
        if (Number.isInteger(e.button)) b = e.button; after = true;
      }
      else if (e.t === "seat" && after && active.has(e.pid)) put(e.pid, e.seat);
      else if (e.t === "button") b = e.seat;
      else if (e.t === "move" && after && active.has(e.pid)) {
        // Moving someone to an open seat, or swapping two players. The dealer button stays with the dealer.
        const from = seats.indexOf(e.pid), to = e.seat;
        if (from < 0 || !Number.isInteger(to) || to < 0 || to >= TABLE_SEATS || to === from) continue;
        if (b == null) b = seats.indexOf(st.dealer);
        const dealerSeat = nextTaken(b), other = seats[to];
        b = dealerSeat;   // pin the button to whoever has it now, so nobody dropped into an empty seat ahead of them takes it
        seats[to] = e.pid; seats[from] = other;
        if (dealerSeat === from) b = to; else if (other != null && dealerSeat === to) b = from;
      }
    }
    for (const pid of active) if (!seats.includes(pid) && this.players().some(p => p.id === pid)) put(pid, null);   // anyone still in without a seat (older saves)
    if (b == null) b = seats.indexOf(st.dealer);
    return { seats, b: nextTaken(b), st };
  }
  /** Players at the table in seat order, starting from seat 1 (kept for older callers). */
  seating() { return this.table().filter(pid => pid != null); }
  seatOf(pid) { return this.table().indexOf(pid); }
  /** Seat with the dealer button: the button's seat, or the next occupied seat clockwise if it's empty. -1 before the start. */
  get buttonSeat() { return this._seatReplay().b; }
  /** Position name for each occupied seat, clockwise from the button: { seat: "BTN" | "SB" | "BB" | "UTG" | ... }. */
  positions() {

    }
    return true;
  }

        avg: n ? Math.round(total / n) : null, iouOwed: s.reduce((t, e) => t + Math.max(0, e.iou), 0), last: n ? s[0].time : null,

/** Session clock as h:mm:ss */
const clockText = ms => { const t = Math.floor((ms || 0) / 1000); return `${Math.floor(t / 3600)}:${String(Math.floor(t / 60) % 60).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
/** The virtual table: players in their random seats around an oval felt, clock in the middle. */
/** The Curtis Game wheel: four equal slices, slice 0 centered under the pointer at the top. */
const WHEEL_COLORS = ["#17734c", "#c0392b", "#2c5aa8", "#b8902e", "#7b3fa0", "#138a8a", "#d2691e", "#a3245a", "#3d4f8f", "#6b8e23", "#8b5a2b"];
/** How each Curtis Game is played. It's all-in: everyone antes, then no more betting. Deal it out, best hand wins. */
const CURTIS_RULES = {
  "Texas Hold'em": ["2 cards each, then 5 shared cards: the flop (3), turn and river.", "Best 5-card hand from your 2 cards and the board."],
  "Seven Card Stud": ["No board. Each player gets 7 cards: 2 down, 4 up, then 1 more down.", "Best 5 of your 7 cards."],
  "PLO": ["4 cards each, then a 5-card board.", "Use exactly 2 of your cards and exactly 3 from the board."],
  "Follow the Queen": ["Seven Card Stud with wild cards. Queens are always wild.", "When a queen is dealt face up, the next face-up card's rank is also wild. Another face-up queen changes it. If the last up card is a queen, only queens are wild."],
  "Iron Cross": ["4 cards each. 5 board cards are laid out in a cross: a row of 3 and a column of 3 sharing the center card.", "Best 5-card hand from your cards plus one line only, across or down."],
  "Baseball": ["Seven Card Stud: 2 down, 4 up, 1 down.", "3s and 9s are wild. Anyone dealt a 4 face up gets an extra face-up card right away."],
  "Crazy Pineapple": ["Hold'em, but you get 3 cards. Discard 1 after the flop.", "Best 5-card hand from your 2 cards and the board."],
  "Razz": ["Seven Card Stud where the lowest hand wins.", "Hands are made just like regular poker, but in this case the worst hand wins. 7 high is the worst possible hand."],
  "Double Board PLO": ["PLO with two 5-card boards dealt at once. 4 cards each.", "Half the pot to the best hand on each board, using exactly 2 of your cards and 3 from that board."],
  "Chicago": ["Seven Card Stud: 2 down, 4 up, 1 down.", "Half the pot to the best hand, half to whoever holds the highest spade face down."],
  "Irish": ["4 cards each, like Omaha. After the flop, discard 2.", "Then it's Hold'em: best 5-card hand from your 2 cards and the board."],
};
/** What "No Thanks" gets you. The Curtis Game is not optional. */
const CURTIS_NOPE = [
  ["Nice Try", "Sorry, the Curtis Game is not optional"],
  ["Denied", "Curtis has noted your request - spin the wheel"],
  ["Nope", "\u201cNo thanks\u201d is not an option"],
  ["Not an Option", "You can fold a hand, but you can't fold the Curtis Game"],
  ["Bold Move", "Wrong answer - spin the wheel"],
  ["House Rules", "Rule #1: Always play the Curtis game - there is no Rule #2"],
  ["Request Rejected", "This button is purely decorative - spin the wheel"],
  ["Absolutely Not", "Nobody leaves until the wheel has spoken"],
  ["Really?", "The Curtis Game didn't drive all the way here to be skipped"],
  ["No Means Spin", "Your chips are staying put until the Curtis Game is played"],
];
let lastNope = -1;
function nopeMessage(rng = Math.random) { let i; do { i = Math.floor(rng() * CURTIS_NOPE.length); } while (i === lastNope && CURTIS_NOPE.length > 1); lastNope = i; return CURTIS_NOPE[i]; }
function curtisRulesHTML(game) {
  const r = CURTIS_RULES[game];
  return `<h2>${esc(game)}</h2>${r ? `<ul class="rules">${r.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="sub">No rules saved for this game.</p>`}`;
}
/** Two-line labels for names too long to fit along one slice. */
const WHEEL_LINES = { "Texas Hold'em": ["Texas", "Hold'em"], "Seven Card Stud": ["Seven Card", "Stud"], "Follow the Queen": ["Follow the", "Queen"],
  "Crazy Pineapple": ["Crazy", "Pineapple"], "Double Board PLO": ["Double", "Board PLO"],
  "Double Board Hold'em": ["Double Board", "Hold'em"], "Omaha Hi-Lo": ["Omaha", "Hi-Lo"], "Short Deck": ["Short", "Deck"] };
function wheelSVG(rotation = 0, small = false, games = CURTIS_GAMES) {
  const n = games.length, r = 96, c = 100, per = 360 / n;
  const slices = games.map((g, i) => {
    const a0 = ((i - 0.5) * per - 90) * Math.PI / 180, a1 = ((i + 0.5) * per - 90) * Math.PI / 180;
    const lines = WHEEL_LINES[g] || [g];
    const label = small ? "" : `<g transform="rotate(${(i * per - 90).toFixed(2)} ${c} ${c})"><text x="${c + 90}" y="${c}" text-anchor="end" class="wheel-txt">${lines.map((w, k) =>
      `<tspan x="${c + 90}" dy="${k === 0 ? (lines.length > 1 ? -2 : 3.5) : 11}"${w.length > 9 ? ' font-size="9"' : ""}>${esc(w)}</tspan>`).join("")}</text></g>`;
    return `<path d="M${c} ${c}L${(c + r * Math.cos(a0)).toFixed(2)} ${(c + r * Math.sin(a0)).toFixed(2)}A${r} ${r} 0 0 1 ${(c + r * Math.cos(a1)).toFixed(2)} ${(c + r * Math.sin(a1)).toFixed(2)}Z" fill="${WHEEL_COLORS[i % WHEEL_COLORS.length]}" stroke="#1b1b1b" stroke-width="1.5"/>${label}`;
  }).join("");
  return `<svg viewBox="0 0 200 200" class="wheel-svg ${small ? "small" : ""}" style="transform:rotate(${rotation}deg)" aria-hidden="true">
    <circle cx="100" cy="100" r="99" fill="#6b4220" stroke="#1b1b1b" stroke-width="2"/>${slices}
    <circle cx="100" cy="100" r="13" fill="#f7f5ef" stroke="#1b1b1b" stroke-width="2"/><circle cx="100" cy="100" r="5" fill="#f2c94c"/></svg>`;
}
/** Spin the wheel to the game the ledger picked: several turns, then land inside that slice. */
function spinWheel(d) {
  const svg = document.querySelector("#curtis-wheel svg"); if (!svg) return;
  const per = 360 / CURTIS_GAMES.length, jitter = (Math.random() - 0.5) * per * 0.7;
  const from = d.from || 0;                          // a Spin Again starts from where the last spin stopped
  const target = Math.ceil(from / 360) * 360 + 360 * 6 - d.pick * per + jitter;   // pointer is at the top; rotating by -pick*per brings that slice under it
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, ms = reduce ? 300 : 4200;
  svg.style.transition = `transform ${ms}ms cubic-bezier(.12,.67,.15,1)`;
  requestAnimationFrame(() => requestAnimationFrame(() => { svg.style.transform = `rotate(${target}deg)`; }));
  setTimeout(() => {
    if (dialog !== d) return;
    d.done = true; d.rotation = target;
    $("#curtis-result").textContent = `${CURTIS_GAMES[d.pick]}!`; $("#curtis-result").classList.add("landed");
    document.querySelectorAll('#modal [data-x^="curtis-"]').forEach(b => (b.disabled = false));
    $("#curtis-result").setAttribute("role", "button"); $("#curtis-result").setAttribute("tabindex", "0"); $("#curtis-result").dataset.x = "curtis-rules";
  }, ms + 80);
}

/** Two playing cards drawn with CSS. cards: [{ r, s }] (missing entries draw as empty slots). */
function cardsHTML(cards, opts = {}) {
  return `<span class="cards ${opts.size || ""}">${cards.map((c, i) => {
    const red = c.s === "♥" || c.s === "♦", empty = !(c.r && c.s);
    const tag = opts.pick ? "button" : "span";
    return `<${tag} ${opts.pick ? `type="button" data-hslot="${i}" aria-label="Card ${i + 1}${empty ? ", not picked" : `: ${c.r}${c.s}`}" aria-pressed="${opts.slot === i}"` : ""}
      class="pcard ${red ? "red" : ""} ${empty ? "empty" : ""} ${opts.slot === i ? "on" : ""}">${empty ? `<span class="pc-q">${c.r || c.s || "?"}</span>`
      : `<span class="pc-r">${c.r}</span><span class="pc-s">${c.s}\uFE0E</span>`}</${tag}>`; }).join("")}</span>`;
}
/** Favorite hand for display: cards when it's a two-card hand, otherwise the old text. */
function handHTML(h, size) { const c = Roster.parseHand(h); return c ? cardsHTML(c, { size }) : esc(h || ""); }
function drawHandPicker() {
  const d = dialog, box = $("#hand-picker"); if (!box) return;
  const cur = d.cards[d.slot], other = d.cards[1 - d.slot];
  const taken = (r, s) => other.r === r && other.s === s; // the same card can't be picked twice
  box.innerHTML = `<div class="hp">
    <div class="hp-cards">${cardsHTML(d.cards, { pick: true, slot: d.slot, size: "big" })}
    <div class="hp-row hp-ranks" role="group" aria-label="Rank for card ${d.slot + 1}">${Roster.RANKS.map(r => `<button type="button" class="hp-rank" data-hr="${r}" aria-pressed="${cur.r === r}" ${cur.s && taken(r, cur.s) ? "disabled" : ""}>${r}</button>`).join("")}</div></div>
    <div class="hp-row" role="group" aria-label="Suit for card ${d.slot + 1}">${Roster.SUITS.map(su => `<button type="button" class="hp-suit ${su === "♥" || su === "♦" ? "red" : ""}" data-hs="${su}" aria-pressed="${cur.s === su}" ${cur.r && taken(cur.r, su) ? "disabled" : ""} aria-label="${({ "♠": "Spades", "♥": "Hearts", "♦": "Diamonds", "♣": "Clubs" })[su]}">${su}\uFE0E</button>`).join("")}</div>
  </div>`;
}

function playEgg(name) {

  const el = document.createElement("div");
  el.className = "egg egg-" + name; el.innerHTML = `<span class="egg-tilt"><span class="egg-box">${EGGS[name]()}</span></span>`;
  // Anchor to the top-right corner of the second card, wherever the picker sits.
  const card = document.querySelector("#hand-picker .pcard:last-child"), field = layer.parentElement;
  if (card && field) {
    const c = card.getBoundingClientRect(), f = field.getBoundingClientRect();
    el.style.setProperty("--ax", (c.right - f.left) + "px"); el.style.setProperty("--ay", (c.top - f.top) + "px");

}
function rosterPicker(d) {

function syncStarter() {

  if (!untouched) return;
  const next = st ? st.map(n => (n ? String(n) : "")) : CHIPS.map(() => "");
  d.counts = next; d.starter = st ? next.slice() : null; next.forEach((v, i) => { const el = $("#bi-" + i); if (el) el.value = v; });
}

  const d = dialog; if (!d || (d.k !== "add" && d.k !== "buy")) return;

  v.forEach((n, i) => { $(`#bi-sub-${i}`).textContent = Money.fmt((n || 0) * CHIPS[i].cents); $(`#bi-${i}`).classList.toggle("bad", n == null);

function cashOutState() {
  const d = dialog;
  let counts = null, cents = null, err = null, has;
  if (d.count) {
    const parsed = d.counts.map(Chips.parseCount);
    has = d.counts.some(s => String(s).trim());
    if (parsed.some(n => n == null)) err = "Chip counts must be whole numbers.";
    else { counts = parsed; cents = Chips.total(parsed); }
  } else {
    has = !!d.typed.trim(); cents = Money.parse(d.typed);
    if (has && cents == null) err = "Enter an amount like 47.35.";
  }
  let q = null;
  if (!err && has && cents != null) { try { q = ledger.quote(d.pid, cents); } catch (e) { err = e.message; } }
  return { counts, cents, err, q };
}

      const nm = ledger.player(d.pid).name, room = chipRoom(); err = act(() => ledger.buyIn(d.pid, c, d.method, counts)); if (!err) { closeDialog(); toast(`${nm} +${Money.fmt(c)} (${METHOD[d.method]})`); chipWarn(room); } break; }
